  luces:{rel:1,init(){S.night=0;S.beam="long";S.act={y:-120,x:geo().LX,glare:0,said:0}},
   approach(dt){S.night=Math.min(1,S.night+dt*1.5);S.act.y=ramp(S.act.y,geo().carY-280,1.3,dt);S.a=S.act.y;return Math.abs(S.act.y-(geo().carY-280))<3},
   draw(){car(S.act.x,S.act.y,"#e0a800",S.act.a||0,{flip:1})},
   lights(){ctx.globalCompositeOperation="lighter";const gr=ctx.createRadialGradient(S.act.x,S.act.y+80,5,S.act.x,S.act.y+80,90);gr.addColorStop(0,"rgba(255,240,180,.35)");gr.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation="source-over";if(S.act.glare){ctx.fillStyle="rgba(255,255,230,"+S.act.glare*.5+")";ctx.beginPath();ctx.arc(S.act.x,S.act.y,60,0,7);ctx.fill()}},
   ok(t,dt){S.beam="short";S.speed=CR*.8;S.act.y+=360*dt},
   ko(t,dt){const g=geo();S.beam="long";S.speed=CR*.8;S.act.y+=330*dt;S.act.glare=Math.min(1,t*2);if(t>.3&&t<1.3){S.act.x=g.LX+38*Math.sin((t-.3)*Math.PI);S.act.a=Math.sin((t-.3)*Math.PI*2)*.3}else S.act.a=0;if(!S.act.said&&t>.3){S.act.said=1;SFX.honk();say("😵 ¡QUE ME DESLUMBRAS!",()=>[S.act.x,S.act.y-40],1.4,"#ffd4cc")}},
   miss:()=>S.act.y>geo().carY-60}
 };
 SC.stop=Object.assign({},SC.cruce,{init(){SC.cruce.init("stop")}});
 SC.semaforo=Object.assign({},SC.cruce,{init(){SC.cruce.init("semaforo")}});
 SC.glorieta=Object.assign({},SC.cruce,{init(){SC.cruce.init("glorieta")}});
 SC.derecha=Object.assign({},SC.cruce,{init(){SC.cruce.init("none",-1)}});
 SC.ambar=Object.assign({},SC.cruce,{init(){SC.cruce.init("semaforo",1,1)}});
 SC.ceda=Object.assign({},SC.cruce,{init(){SC.cruce.init("none",1)}});
 SC.senal={stop:0,init(q){SC.senal.stop=q.okA==="turn"?1:0;S.act={side:q.okA==="turn",on:null,truck:null,pol:null,said:0,miss:0}},
  draw(a,{cx}){const A=S.act;if(A.side){ctx.fillStyle="#3b3f46";ctx.fillRect(cx+116,a-140,W,120);ctx.fillStyle="#fff";for(let x=cx+150;x<W;x+=60)ctx.fillRect(x,a-82,30,4)}
   if(A.on)car(A.on.x,A.on.y,"#e0a800",0,{flip:1});if(A.truck)truck(geo().RX,A.truck);if(A.pol)car(A.pol.x,A.pol.y,"#f4f4f4",0,{siren:Math.sin(performance.now()/90)})},
  ok(t,dt){const g=geo(),A=S.act,q=S.q;
   if(q.okA==="turn"){S.brake=t<.5;if(t<.5)S.speed=0;else if(S.a<g.carY+80){S.speed=200}else{S.speed=0;S.hold=1;S.carA=ramp(S.carA,Math.PI/2,5,dt);if(S.carA>.6)S.carX+=300*dt}}
   else{S.speed=ramp(S.speed,q.okA==="slow"?CR*.45:CR*.85,2.5,dt);S.brake=q.okA==="slow"&&t<.8}
   if(!A.said){A.said=1;say(q.okA==="turn"?"✔ Me desvío":q.okA==="slow"?"✔ Despacito":"✔ Entendido",()=>[S.carX,geo().carY-46],1.4,"#d8f5e2")}},
  ko(t,dt){const g=geo(),A=S.act,k=S.q.koA;
   if(k==="contra"){S.speed=CR;if(!A.on)A.on={x:g.RX,y:-110};A.on.y+=520*dt;const near=A.on.y>g.carY-330&&A.on.y<g.carY+60;S.carX=ramp(S.carX,near?g.LX:g.RX,6,dt);S.carA=(g.RX-S.carX)/-700*(near?1:-1);if(A.on.y>g.carY-90&&!A.miss){A.miss=1;SFX.honk();SFX.screech();say("¡PIIIII!",()=>[A.on.x,A.on.y-40],1.3,"#ffd4cc")}}
   else if(k==="skid"){S.speed=ramp(S.speed,t<1.4?CR*1.3:CR*.6,2,dt);if(t>.3&&t<1.6){const d=Math.max(0,1.6-t);S.carA=Math.sin(t*12)*.35*d;S.carX=ramp(S.carX,t<1?g.cx+102:g.RX,3,dt);if(Math.random()<.4)puff(S.carX,g.carY+30,1,"#e6e6e6",30,5);S.shake=3}if(t>.3&&!A.said){A.said=1;SFX.screech()}if(t>.9)A.miss=1}
   else if(k==="park"){S.speed=ramp(S.speed,0,2.2,dt);S.carX=ramp(S.carX,g.cx+95,3,dt);if(t>1){if(!A.pol)A.pol={x:g.LX,y:H+80};A.pol.y=ramp(A.pol.y,g.carY+10,3,dt);if(!A.said){A.said=1;SFX.siren(1);say("🚨 ¡Multa! Aquí no",()=>[A.pol.x,A.pol.y-46],1.6,"#ffd4cc")}if(t>1.2)A.miss=1}}
   else if(k==="slowhonk"){S.speed=ramp(S.speed,CR*.12,3,dt);if(A.truck==null)A.truck=H+140;A.truck=ramp(A.truck,g.carY+170,2.5,dt);if(t>.9&&!A.said){A.said=1;SFX.honk();say("¡PIII! ¡Muévete!",()=>[g.RX,A.truck-140],1.5,"#ffd4cc");A.miss=1}}
   else{S.speed=ramp(S.speed,CR*.7,2,dt);if(!A.pol)A.pol={x:g.LX,y:H+80};A.pol.y-=260*dt;if(t>.8&&!A.said){A.said=1;SFX.siren(1);say("🚨 ¡Multa! Por ahí no",()=>[A.pol.x,A.pol.y-46],1.6,"#ffd4cc");A.miss=1}}},
  miss:()=>S.act.miss};

 /* ---------- Bucle ---------- */
 let onApproach=null,resolve=null,missDone=false;
 function loop(now){
  if(!alive)return;const dt=Math.min(.05,(now-(lastT||now))/1000);lastT=now;
  const g=geo(),sc=S.sc&&SC[S.sc];
  if(S.phase==="approach"&&sc){
   if(sc.rel){S.speed=ramp(S.speed,S.sc==="adelantar"?CR*.8:CR,2,dt);if(sc.approach(dt)){S.phase="ask";S.asked=1;S.signY=S.a-60;S.signW=S.world;onApproach&&onApproach()}}
   else{const target=sc.stop?g.carY-118:g.carY-190;const d=target-S.a;S.speed=sc.stop?Math.min(CR,Math.max(0,d*2.2)):CR;S.brake=sc.stop&&d<150;if(d<2){S.phase="ask";S.speed=sc.stop?0:S.speed;onApproach&&onApproach()}}
  }else if(S.phase==="drive"){S.speed=ramp(S.speed,CR,1.5,dt);S.brake=0}
  else if(S.phase==="res"&&resolve){S.t+=dt;resolve(S.t,dt)}
  else if(S.phase==="crash"){S.t+=dt;crashStep(S.t,dt)}
  if(S.phase!=="ask"){S.world+=S.speed*dt;if(sc&&!sc.rel)S.a+=S.speed*dt}
  if(S.phase!=="ask"){S.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=(p.vy+S.speed)*dt;p.vx*=.97;p.vy*=.97;p.life-=dt});S.parts=S.parts.filter(p=>p.life>0);S.bub.forEach(b=>b.life-=dt);S.bub=S.bub.filter(b=>b.life>0)}
  if(S.damage>=2&&!S.wreck&&Math.random()<dt*8)S.parts.push({x:S.carX+(Math.random()-.5)*14,y:g.carY-30,vx:(Math.random()-.5)*30,vy:-40,r:5+Math.random()*5,c:"rgba(90,90,90,.6)",life:1,max:1.4});
  S.flash=Math.max(0,S.flash-dt*2.2);S.shake=Math.max(0,S.shake-dt*20);
  if(S.phase!=="res"&&S.phase!=="crash"&&!S.hold){S.carX=ramp(S.carX,g.RX,3,dt);S.carA=ramp(S.carA,0,4,dt)}
  $("gvKmh").textContent=S.phase==="res"&&S.kmhOver!=null?S.kmhOver:Math.round(S.speed*.36);
  engineSet(S.phase==="ask"?40:S.speed);
  frame();raf=requestAnimationFrame(loop);
 }
 function crashStep(t,dt){const g=geo();if(t<.9){S.speed=ramp(S.speed,0,1.5,dt);S.carA+=dt*14*(1-t);S.carX=ramp(S.carX,g.cx+100,2.5,dt);if(Math.random()<.5)puff(S.carX,g.carY,2,"#d0d0d0",80,6)}else{S.speed=0;if(!S.wreck){S.wreck=true;S.shake=22;SFX.crash();puff(S.carX,g.carY-20,40,"#ffb020",220,9);puff(S.carX,g.carY-20,30,"#666",140,12);stamp("SINIESTRO TOTAL","bad")}if(Math.random()<.4)S.parts.push({x:S.carX,y:g.carY-20,vx:(Math.random()-.5)*20,vy:-60,r:10,c:"rgba(60,60,60,.55)",life:2,max:2})}}

 /* ---------- UI / flujo ---------- */
 let deck=[],qi=0,fails=[],typing=0,advance=null,timer=0,clock=0,examEnd=0,over=false,order=[];
 function stamp(txt,cls){const b=$("gvStampBox");b.innerHTML="";const d=document.createElement("div");d.className="gv-stamp "+(cls||"");d.textContent=txt;b.appendChild(d);setTimeout(()=>{if(d.parentNode&&txt!=="SINIESTRO TOTAL")d.remove()},1500)}
 function lives(){$("gvLives").innerHTML=Array.from({length:ALLOWED},(_,i)=>`<span class="${i<S.damage?"off":""}"></span>`).join("")+(S.damage===ALLOWED?`<b class="gv-warn">¡Último aviso!</b>`:"");$("gvLives").setAttribute("aria-label",`Fallos: ${S.damage}. Se permiten ${ALLOWED}`)}
 function prog(){const p=qi/ROUND*100;$("gvProg").style.width=p+"%";$("gvCar").style.left=p+"%";$("gvTramo").textContent=`Tramo ${Math.min(qi+1,ROUND)}/${ROUND}`}
 function talk(html,done,speed=18){clearInterval(typing);const el=$("gvTxt"),tmp=document.createElement("div");tmp.innerHTML=html;const full=tmp.textContent;let i=0;$("gvCono").classList.add("talk");el.textContent="";
  const finish=()=>{clearInterval(typing);typing=0;el.innerHTML=html;$("gvCono").classList.remove("talk");done&&done()};
  advance=()=>finish();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return finish();
  typing=setInterval(()=>{i+=2;el.textContent=full.slice(0,i);if(i%6===0)SFX.blip();if(i>=full.length)finish()},speed)}
 function nextBtn(label,fn){$("gvUI").innerHTML=`<button type="button" class="gv-next" id="gvNext">${esc(label)}</button>`;const b=$("gvNext");b.onclick=()=>{advance=null;fn()};advance=()=>b.click();b.focus({preventScroll:true})}
 const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

 function intro(){resetScene();S.damage=0;size();S.carX=geo().RX;S.phase="drive";lives();qi=0;prog();$("gvStampBox").innerHTML="";
  $("gvUI").innerHTML="";
  talk("¡Hola! Soy el <b>Profe Cono</b> y esto es el <b>examen teórico de verdad</b>: 30 preguntas, 30 minutos y como mucho <b>3 fallos</b>. Pero aquí <b>cada respuesta mueve el coche</b>: si aciertas, conduces de lujo; si fallas, el coche hace una locura. Y al <b>4.º fallo</b>… siniestro total. Hay <b>"+QS.length+" preguntas</b> y te saco primero las que aún no has visto (te quedan "+(QS.length-seenGet().length)+").",()=>nextBtn("Empezar el examen",start));}
 function start(){const tt=$("gvTitle");if(tt){tt.style.opacity=0;tt.style.pointerEvents="none"}deck=pickDeck();qi=0;fails=[];over=false;S.damage=0;S.wreck=false;lives();A();
  examEnd=Date.now()+EXAM_MIN*60000;clearInterval(clock);const tick=()=>{const ms=Math.max(0,examEnd-Date.now()),m=Math.floor(ms/60000),sec=Math.floor(ms/1000)%60;$("gvClock").textContent=`${m}:${String(sec).padStart(2,"0")}`;$("gvClock").classList.toggle("low",ms<180000);if(ms<=0&&!over)timeUp()};tick();clock=setInterval(tick,500);scene()}
 function seenGet(){const v=api.store.get("gv-seen");return Array.isArray(v)?v:[]}
 function seenAdd(id){let v=seenGet();if(!v.includes(id))v.push(id);if(v.length>=QS.length)v=[];api.store.set("gv-seen",v)}
 function pickDeck(){const seen=seenGet(),fresh=shuffle(QS.filter(q=>!seen.includes(q.id))),old=shuffle(QS.filter(q=>seen.includes(q.id)));return shuffle(fresh.slice(0,ROUND).concat(old.slice(0,Math.max(0,ROUND-fresh.length))))}
 function timeUp(){over=true;clearInterval(clock);clearInterval(timer);Object.assign(S,{phase:"drive",sc:null,rain:0,night:0,phone:0});S.speed=0;engineOff();SFX.bad();stamp("TIEMPO AGOTADO","bad");$("gvUI").innerHTML="";
  talk(`<span class="gv-end"><span class="big">NO APTO · Tiempo agotado</span><br>Se acabaron los 30 minutos en el tramo ${qi+1}. En el examen real, lo que no contestas cuenta como fallo.</span>`,()=>{$("gvUI").innerHTML=`<div class="gv-end">${recap()}</div><button type="button" class="gv-next" id="gvAgain">Repetir examen</button>`;$("gvAgain").onclick=()=>{resetScene();S.carX=geo().RX;S.phase="drive";$("gvStampBox").innerHTML="";start()};advance=()=>$("gvAgain").click()},12)}
 function scene(){
  const q=deck[qi];prog();Object.assign(S,{q,hold:0,carX:geo().RX,carA:0,signY:0,signW:0,asked:0,sc:q.sc,phase:"drive",night:0,rain:0,solid:false,beam:"long",phone:0,kmhOver:null,a:-220,t:0,bub:[],act:{}});
  $("gvUI").innerHTML="";
  SC[q.sc].init(q);
  if(!SC[q.sc].rel)S.a=-220;
  talk(esc(q.intro),null,16);
  setTimeout(()=>{if(!alive||over)return;S.phase="approach";onApproach=()=>ask(q)},700);
 }
 function ask(q){
  onApproach=null;if(over)return;SFX.blip();
  talk(esc(q.q),()=>{
   order=shuffle(q.o.map((_,i)=>i));
   $("gvUI").innerHTML=(q.sign?`<div class="gv-sign">${signSVG(q.sign)}</div>`:"")+`<div class="gv-opts">${order.map((k,n)=>`<button type="button" class="gv-opt" data-k="${k}"><kbd>${n+1}</kbd><span>${esc(q.o[k])}</span></button>`).join("")}</div>`;
   $("gvUI").querySelectorAll(".gv-opt").forEach(b=>b.onclick=()=>answer(q,+b.dataset.k));
   $("gvUI").querySelector(".gv-opt").focus({preventScroll:true});
  },14);
 }
 function answer(q,k){
  if(S.phase!=="ask"||over)return;clearInterval(timer);advance=null;
  const ok=k===0;$("gvUI").innerHTML="";
  $("gvTxt").textContent=ok?"¡Veamos qué pasa!":k<0?"¡Te has quedado en blanco! Y el coche, sin control…":"Mmm… agárrate.";
  if(!ok){S.damage++;fails.push({q,k});lives()}
  const crash=!ok&&S.damage>ALLOWED,sc=SC[q.sc];S.phase="res";S.t=0;missDone=false;
  resolve=(t,dt)=>{
   (ok?sc.ok:sc.ko)(t,dt);
   if(!ok&&!missDone&&sc.miss(S.a)){missDone=true;if(crash){S.phase="crash";S.t=0}else{stamp("¡POR LOS PELOS!");S.shake=8;SFX.bad()}}
   if(ok&&t>.25&&!missDone){missDone=true;SFX.good()}
   if(t>3.0&&S.phase==="res")finishRes(q,ok,crash);
  };
  if(crash)setTimeout(()=>{if(!alive)return;if(S.phase==="res"){S.phase="crash";S.t=0}setTimeout(()=>alive&&gameOver(q),2400)},1300);
 }
 function finishRes(q,ok,crash){
  if(crash||over)return;S.phase="drive";resolve=null;if(!S.hold)S.carA=0;seenAdd(q.id);
  const html=`${ok?"<b style='color:#18794e'>¡Bien!</b> ":"<b>¡Fallo!</b> "}${esc(ok?q.ok:q.ko)} <span class="gv-rule">${esc(q.rule)}</span>`;
  talk(html,()=>nextBtn(qi+1<ROUND?"Siguiente tramo":"Llegar a destino",()=>{qi++;if(qi<ROUND)scene();else win()}),12);
 }
 function recap(){return fails.length?`<ul>${fails.map(f=>`<li>${f.q.sign?`<span style="display:inline-block;width:44px;height:44px;vertical-align:middle;margin-right:8px">${signSVG(f.q.sign)}</span>`:""}<b>${esc(f.q.q)}</b><br>Correcta: ${esc(f.q.o[0])}. ${esc(f.q.rule)}</li>`).join("")}</ul>`:""}
 function win(){
  over=true;clearInterval(clock);const used=Math.round((EXAM_MIN*60000-(examEnd-Date.now()))/60000);
  qi=ROUND;prog();Object.assign(S,{sc:null,phase:"drive",rain:0,night:0,solid:false,phone:0});SFX.win();stamp(fails.length?"¡APTO!":"¡PERFECTO!","good");
  const best=api.store.get("gv-best")||0,score=ROUND-fails.length;if(score>best)api.store.set("gv-best",score);
  $("gvUI").innerHTML="";
  talk(`<span class="gv-end"><span class="big">Has llegado a destino</span><br><b style="color:#18794e">APTO</b> con ${fails.length} ${fails.length===1?"fallo":"fallos"} de ${ROUND} en unos ${Math.max(1,used)} min. ${fails.length?"El Profe Cono te firma el apto, pero repasa esto:":"Cero fallos: el Profe Cono se ha emocionado."}</span>`,()=>{
   $("gvUI").innerHTML=`<div class="gv-end">${recap()}</div><button type="button" class="gv-next" id="gvAgain">Otra ruta</button>`;$("gvAgain").onclick=start;$("gvAgain").textContent="Repetir examen";advance=()=>$("gvAgain").click()},12);
 }
 function gameOver(q){
  if(over)return;over=true;clearInterval(clock);resolve=null;engineOff();
  talk(`<span class="gv-end"><span class="big">NO APTO · Siniestro total</span><br>Cuarto fallo en el tramo ${qi+1}: en el examen real solo se permiten 3. Tranquilidad: aquí nadie sale herido, salvo tu orgullo. Antes de la revancha, repasa esto:</span>`,()=>{
   $("gvUI").innerHTML=`<div class="gv-end">${recap()}</div><button type="button" class="gv-next" id="gvAgain">Revancha</button>`;$("gvAgain").onclick=()=>{resetScene();S.carX=geo().RX;S.phase="drive";$("gvStampBox").innerHTML="";start()};advance=()=>$("gvAgain").click()},12);
 }

 function onKey(e){if(!alive)return;if(S.phase==="ask"&&/^[1-3]$/.test(e.key)){const b=$("gvUI").querySelectorAll(".gv-opt")[+e.key-1];if(b){e.preventDefault();b.click()}return}
  if((e.key==="Enter"||e.key===" ")&&advance&&!(e.target&&e.target.closest&&e.target.closest("button"))){e.preventDefault();advance()}}
 document.addEventListener("keydown",onKey);
 $("gvTxt").parentNode.addEventListener("click",e=>{if(!e.target.closest("button")&&typing&&advance)advance()});

 resetScene();size();S.carX=geo().RX;intro();raf=requestAnimationFrame(loop);
 return function stop(){alive=false;cancelAnimationFrame(raf);clearInterval(timer);clearInterval(clock);clearInterval(typing);ro.disconnect();document.removeEventListener("keydown",onKey);engineOff();try{ac&&ac.close()}catch(e){}};
};
})();

<script>
/* ToTest · Kit de juegos «aprende jugando»
   Motor común: presentador al estilo Pokémon, escenario en canvas, vidas, preguntas bonus, repaso final.
   Cada juego aporta su escena (dibujo + animaciones de acierto/fallo) y usa las preguntas de un test de ToTest. */
(function(){
window.ToTestGames=window.ToTestGames||{};
const CSS=`
.kv{--kc:#1f4fd1}
.kv-head{background:#16181c;color:#fff;padding:14px max(5vw,16px)}
.kv-head .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kv-head a{color:#fff;text-decoration:none;font-weight:700;min-height:44px;display:inline-flex;align-items:center}
.kv-head h1{font-size:clamp(22px,3.4vw,30px)}
.kv-head button{min-height:44px;border-radius:22px;border:1.5px solid #4a4f58;background:#23262c;color:#fff;cursor:pointer;font-size:16px;padding:0 14px}

.kv-hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-weight:700}
.kv-bar{flex:1 1 180px;height:12px;border-radius:6px;background:var(--line);overflow:hidden}.kv-bar i{display:block;height:100%;background:var(--kc);transition:width .5s}
.kv-lives{display:flex;gap:4px;align-items:center;font-size:22px;line-height:1;white-space:nowrap}
.kv-lives .off{opacity:.2;filter:grayscale(1)}
.kv-pts{font-family:"Archivo Black",sans-serif;font-weight:400;white-space:nowrap;background:#16181c;color:#fff;border-radius:6px;padding:4px 10px}

.kv-stage.pix canvas{image-rendering:pixelated}
.kv-title{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,rgba(22,24,28,.55),rgba(22,24,28,.9));backdrop-filter:blur(3px);transition:opacity .4s}.kv-title.off{opacity:0;pointer-events:none}
.kv-poster{height:92%;aspect-ratio:3/4;border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:kvPo 3s ease-in-out infinite alternate}.kv-poster svg{width:100%;height:100%;display:block}@keyframes kvPo{from{transform:rotate(-1.5deg) translateY(0)}to{transform:rotate(1.5deg) translateY(-6px)}}
.kv-stampbox{position:absolute;inset:0;pointer-events:none}
.kv-stamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-7deg);font-family:"Archivo Black",sans-serif;font-size:clamp(24px,5.6vw,48px);color:#fff;padding:6px 18px;border:5px solid #fff;border-radius:10px;background:#e0731a;box-shadow:0 8px 0 rgba(0,0,0,.3);white-space:nowrap;animation:kvSt .35s cubic-bezier(.2,1.6,.5,1)}
.kv-stamp.bad{background:#b42318}.kv-stamp.good{background:#18794e}.kv-stamp.gold{background:#c98a00}
@keyframes kvSt{from{transform:translate(-50%,-50%) rotate(-7deg) scale(2.2);opacity:0}}
.kv-box{position:relative;margin-top:-6px;background:#fffdf4;color:#16181c;border:4px solid #16181c;border-radius:12px;box-shadow:inset 0 0 0 3px var(--kc),0 6px 0 rgba(0,0,0,.18);padding:16px 18px 16px 112px;min-height:150px}

.kv-host .mo{opacity:0}.kv-host.talk .mo{animation:kvMo .26s steps(1) infinite}.kv-host.talk .mc{animation:kvMc .26s steps(1) infinite}.kv-host .lid{opacity:0;animation:kvLid 3.8s steps(1) infinite}
@keyframes kvMo{0%{opacity:1}50%{opacity:0}}@keyframes kvMc{0%{opacity:0}50%{opacity:1}}@keyframes kvLid{0%,93%{opacity:0}94%,100%{opacity:1}}@keyframes kvBob{to{transform:translateY(-4px) rotate(-2deg)}}
.kv-name{position:absolute;top:-16px;left:104px;background:#16181c;color:#fff;font-family:"Archivo Black",sans-serif;font-size:14px;padding:3px 12px;border-radius:6px;border-bottom:3px solid var(--kc)}
.kv-txt{font-size:18px;line-height:1.45;min-height:52px;margin:0}
.kv-txt b{color:#b42318}.kv-txt code,.kv-opt code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.88em;background:#eef1f6;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere;color:#16181c}
.kv-rule{display:block;margin-top:8px;font-size:16px;color:#3c4249;border-left:4px solid var(--kc);padding-left:10px}
.kv-extra{margin-top:10px}
.kv-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}

.kv-opt:hover{transform:translateY(-2px)}.kv-opt:active{transform:translateY(2px);box-shadow:none}

.kv-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kv-next{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:8px 18px;border:0;border-radius:8px;background:#16181c;color:#fff;font:700 16px "Atkinson Hyperlegible",sans-serif;cursor:pointer}
.kv-next.alt{background:var(--kc)}
.kv-next.go::after{content:"▼";font-size:12px;animation:kvBl .7s steps(2) infinite}@keyframes kvBl{50%{opacity:0}}
.kv-end .big{font-family:"Archivo Black",sans-serif;font-size:clamp(28px,6vw,42px);line-height:1}
.kv-end ul{margin:10px 0 0;padding-left:20px;font-size:15px}.kv-end li{margin-bottom:8px}
.kv-help{color:var(--soft);font-size:14px;margin:12px 0 0;text-align:center}
@media(max-width:600px){.kv-box{padding:56px 12px 14px}.kv-host{left:auto;right:8px;top:-62px;bottom:auto;width:64px;height:84px}.kv-name{left:12px}.kv-txt{font-size:17px}.kv-opts{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.kv-host.talk,.kv-stamp,.kv-next.go::after{animation:none}}
`;

window.ToTestKit=function(G){return function(root,api){
 const esc=api.esc,rich=api.rich||esc;
 if(!document.getElementById("kv-css")){const st=document.createElement("style");st.id="kv-css";st.textContent=CSS;document.head.appendChild(st)}
 const LIVES=G.lives||3,BONUS=G.bonusEvery||5;
 root.innerHTML=`<div class="kv" style="--kc:${G.color}"><header class="kv-head"><div class="wrap"><a href="#">← ToTest</a><h1>${esc(G.title)}</h1><button type="button" id="kvSnd">Sonido: sí</button></div></header>
 <main class="kv-main"><div class="kv-hud" ${G.hud===false?'style="display:none"':""}><span id="kvProg">—</span><div class="kv-bar" aria-hidden="true"><i id="kvBar"></i></div><span class="kv-pts" id="kvPts">0</span><span class="kv-lives" id="kvLives"></span></div>
 <div class="kv-stage ${G.pixel?"pix":""}"><canvas id="kvCv" aria-label="${esc(G.canvasLabel||"Escena del juego")}"></canvas><div class="kv-stampbox" id="kvStamp"></div>${api.poster?`<div class="kv-title" id="kvTitle"><div class="kv-poster">${api.poster}</div></div>`:""}</div>
 <section class="kv-box" aria-live="polite"><div class="kv-host" id="kvHost">${G.host.svg}</div><span class="kv-name">${esc(G.host.name)}</span><p class="kv-txt" id="kvTxt"></p><div id="kvUI"></div></section>
 <p class="kv-help">Responde con las teclas 1-4 · Enter o espacio para continuar</p></main></div>`;
 const $=id=>document.getElementById(id),cv=$("kvCv"),ctx=cv.getContext("2d");
 let W=G.W||820,H=G.H||440,alive=true,raf=0,lastT=0;
 const K={ctx,S:{},W,H,esc,rich,api};

 /* sonido */
 let ac=null,snd=api.store.get("kv-snd")!==false;
 const A=()=>{if(!snd)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){ac=null}return ac};
 const tone=(f,d,type="square",v=.05,when=0)=>{const c=A();if(!c)return;const t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)};
 const noise=(d,v=.15,freq=1200)=>{const c=A();if(!c)return;const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type="bandpass";f.frequency.value=freq;s.buffer=b;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);s.connect(f);f.connect(g);g.connect(c.destination);s.start()};
 K.SFX={tone,noise,good:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.16,"triangle",.07,i*.07)),bad:()=>{tone(220,.25,"sawtooth",.05);tone(165,.35,"sawtooth",.05,.18)},
  blip:()=>tone(880+Math.random()*120,.03,"square",.012),boom:()=>{noise(1,.35,300);tone(70,.7,"sine",.2)},jump:()=>{const c=A();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.setValueAtTime(300,c.currentTime);o.frequency.exponentialRampToValueAtTime(900,c.currentTime+.15);g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.22)},
  coin:()=>{tone(988,.08,"square",.05);tone(1319,.3,"square",.05,.08)},power:()=>[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,.1,"square",.045,i*.06)),win:()=>[523,659,784,659,784,1046].forEach((f,i)=>tone(f,.2,"triangle",.07,i*.12)),
  over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,"triangle",.07,i*.22))};
 $("kvSnd").onclick=()=>{snd=!snd;api.store.set("kv-snd",snd);$("kvSnd").textContent="Sonido: "+(snd?"sí":"no")};$("kvSnd").textContent="Sonido: "+(snd?"sí":"no");

 /* utilidades de dibujo para los juegos */
 K.rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)};
 K.parts=[];K.bub=[];
 K.puff=(x,y,n,c,sp=60,r=6,life=1.2)=>{for(let i=0;i<n;i++)K.parts.push({x,y,vx:(Math.random()-.5)*sp*2,vy:(Math.random()-.5)*sp*2-20,r:r*(.5+Math.random()),c,life:life*(.6+Math.random()*.6),max:life*1.2,g:0})};
 K.say=(txt,at,dur=1.5,col="#fff")=>K.bub.push({txt,at:typeof at==="function"?at:()=>at,life:dur,col});
 K.ramp=(v,to,k,dt)=>v+(to-v)*Math.min(1,k*dt);
 K.stamp=(txt,cls,keep)=>{if(G.stamps===false)return;const b=$("kvStamp");b.innerHTML="";const d=document.createElement("div");d.className="kv-stamp "+(cls||"");d.textContent=txt;b.appendChild(d);if(!keep)setTimeout(()=>d.remove(),1500)};
 K.shake=0;K.flash=0;
 function bubble(txt,x,y,col){ctx.font="bold 15px 'Atkinson Hyperlegible',sans-serif";const w=ctx.measureText(txt).width+18;x=Math.max(w/2+4,Math.min(W-w/2-4,x));y=Math.max(40,y);ctx.fillStyle=col;ctx.strokeStyle="#16181c";ctx.lineWidth=2.5;K.rr(x-w/2,y-34,w,26,8);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(x-6,y-9);ctx.lineTo(x,y);ctx.lineTo(x+6,y-9);ctx.fill();ctx.fillStyle="#16181c";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,x,y-21)}

 function size(){const w=cv.clientWidth||800;const mob=w<620;W=mob?(G.mW||G.W||820):(G.W||820);H=mob?(G.mH||G.H||440):(G.H||440);K.W=W;K.H=H;K.mob=mob;const dpr=Math.min(2,window.devicePixelRatio||1);if(G.pixel){cv.width=W;cv.height=H}else{cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr)}G.resize&&G.resize(K)}
 const ro=new ResizeObserver(size);ro.observe(cv);

 /* estado de partida */
 let set=null,deck=[],qi=0,lives=LIVES,pts=0,okN=0,fails=[],phase="idle",t=0,typing=0,advance=null,curOk=false,ended=false;
 K.phase=()=>phase;K.info=()=>({lives,pts,qi,n:deck.length,LIVES,okN});
 function hud(){$("kvProg").textContent=deck.length?`Pregunta ${Math.min(qi+1,deck.length)}/${deck.length}`:"—";$("kvBar").style.width=(deck.length?qi/deck.length*100:0)+"%";$("kvPts").textContent=pts+" pts";
  $("kvLives").innerHTML=Array.from({length:LIVES},(_,i)=>`<span class="${i<lives?"":"off"}">${G.lifeIcon||"❤️"}</span>`).join("");$("kvLives").setAttribute("aria-label",`Vidas: ${lives}`)}
 function talk(html,done,speed=16){clearInterval(typing);const el=$("kvTxt"),tmp=document.createElement("div");tmp.innerHTML=html;const full=tmp.textContent;let i=0;$("kvHost").classList.add("talk");el.textContent="";
  const fin=()=>{clearInterval(typing);typing=0;el.innerHTML=html;$("kvHost").classList.remove("talk");done&&done()};advance=fin;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return fin();
  typing=setInterval(()=>{i+=2;el.textContent=full.slice(0,i);if(i%6===0)K.SFX.blip();if(i>=full.length)fin()},speed)}
 function buttons(list){$("kvUI").innerHTML=`<div class="kv-btns">${list.map((b,i)=>`<button type="button" class="kv-next ${i?"alt":"go"}" data-i="${i}">${esc(b[0])}</button>`).join("")}</div>`;
  const bs=$("kvUI").querySelectorAll("button");bs.forEach(b=>b.onclick=()=>{advance=null;list[+b.dataset.i][1]()});advance=()=>bs[0].click();bs[0].focus({preventScroll:true})}
 const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
 const pick=a=>a[Math.random()*a.length|0];

 function intro(){phase="idle";ended=false;K.S={};G.setup&&G.setup(K);hud();
  const sets=G.sets.filter(s=>api.tests[s.id]);
  talk(G.introText,()=>buttons(sets.map(s=>[s.label,()=>start(s.id)])));}
 function start(id){const tt=$("kvTitle");if(tt)tt.classList.add("off");K.setId=id;set=api.tests[id];deck=shuffle(set.q).map(q=>({q:q[0],o:q[1],hint:q[2],rule:q[3],x:q[4]}));qi=0;lives=LIVES;pts=0;okN=0;fails=[];ended=false;K.S={};G.setup&&G.setup(K);A();hud();next()}
 function next(){if(qi>=deck.length)return win();const q=deck[qi];q.bonus=(qi+1)%BONUS===0;hud();phase="enter";t=0;$("kvUI").innerHTML="";
  if(q.bonus)K.stamp(G.bonusLabel||"⭐ PREGUNTA BONUS","gold");
  G.enter&&G.enter(K,q,qi);talk(esc(q.bonus?(G.bonusIntro||"¡Pregunta bonus! Si aciertas, ganas un premio."):pick(G.preLines||["¡Ahí va otra!"])),null,14)}
 function ask(){const q=deck[qi];phase="ask";
  talk(rich(q.q),()=>{const ord=shuffle(q.o.map((_,i)=>i));
   $("kvUI").innerHTML=(G.extra?G.extra(K,q):"")+`<div class="kv-opts">${ord.map((k,n)=>`<button type="button" class="kv-opt" data-k="${k}"><kbd>${n+1}</kbd><span>${rich(q.o[k])}</span></button>`).join("")}</div>`;
   $("kvUI").querySelectorAll(".kv-opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));$("kvUI").querySelector(".kv-opt").focus({preventScroll:true})},12)}
 function answer(k){if(phase!=="ask")return;advance=null;const q=deck[qi];curOk=k===0;$("kvUI").innerHTML="";
  $("kvTxt").textContent=curOk?"¡Veamos!":"Uy, uy, uy…";
  if(curOk){okN++;pts+=q.bonus?250:100}else{lives--;fails.push(q)}
  hud();phase="res";t=0;K.lost=!curOk&&lives<=0;
  (curOk?G.okStart:G.koStart)&&(curOk?G.okStart:G.koStart)(K,q)}
 function afterRes(){const q=deck[qi];
  if(!curOk&&lives<=0){phase="over";t=0;G.overStart&&G.overStart(K);K.SFX.over();K.stamp(G.overStamp||"GAME OVER","bad",true);setTimeout(()=>alive&&gameOver(),1800);return}
  let extra="";
  if(curOk&&q.bonus){if(lives<LIVES){lives++;extra=` <b style="color:#c98a00">⭐ ¡Bonus! Recuperas una vida.</b>`}else{pts+=250;extra=` <b style="color:#c98a00">⭐ ¡Bonus! Vidas a tope: +250 pts extra.</b>`}G.bonusGet&&G.bonusGet(K);K.SFX.power();hud()}
  phase="wait";
  talk(`${curOk?"<b style='color:#18794e'>¡Bien!</b> ":"<b>¡Fallo!</b> Era: "+rich(q.o[0])+". "}${esc(pick(curOk?G.okLines:G.koLines))}${extra} <span class="kv-rule">${rich(q.rule)}</span>`,
   ()=>buttons([[qi+1<deck.length?"Siguiente":"Ver resultado",()=>{qi++;next()}]]),10)}
 function recap(){return fails.length?`<p>Para repasar:</p><ul>${fails.map(f=>`<li><b>${rich(f.q)}</b><br>Correcta: ${rich(f.o[0])}. ${rich(f.rule)}</li>`).join("")}</ul>`:""}
 function finish(title,msg){ended=true;const n=Math.round(okN/deck.length*100)/10,best=api.store.get("kvbest:"+G.id+":"+set.id)||0;if(pts>best)api.store.set("kvbest:"+G.id+":"+set.id,pts);
  talk(`<span class="kv-end"><span class="big">${esc(title)}</span><br>${esc(msg)} Nota: <b style="color:#16181c">${String(n).replace(".",",")}/10</b> · ${okN}/${deck.length} aciertos · ${pts} pts${best&&pts<=best?` (récord: ${best}).`:pts>best?" · ¡nuevo récord!":"."}</span>`,
   ()=>{$("kvUI").innerHTML=`<div class="kv-end">${recap()}</div>`;const sets=G.sets.filter(s=>api.tests[s.id]);
    const box=document.createElement("div");$("kvUI").appendChild(box);
    box.innerHTML=`<div class="kv-btns">${[["Jugar otra vez",set.id],...sets.filter(s=>s.id!==set.id).map(s=>[s.label,s.id])].map((b,i)=>`<button type="button" class="kv-next ${i?"alt":"go"}" data-s="${b[1]}">${esc(b[0])}</button>`).join("")}</div>`;
    const bs=box.querySelectorAll("button");bs.forEach(b=>b.onclick=()=>{advance=null;start(b.dataset.s)});advance=()=>bs[0].click()},10)}
 function win(){phase="win";t=0;qi=deck.length;hud();G.winStart&&G.winStart(K);K.SFX.win();K.stamp(G.winStamp||"¡NIVEL SUPERADO!","good");finish(G.winTitle||"¡Lo has conseguido!",(G.winText||"")+" ")}
 function gameOver(){finish(G.overTitle||"Game over",G.overText||"Te has quedado sin vidas.")}

 function loop(now){if(!alive)return;const dt=Math.min(.05,(now-(lastT||now))/1000);lastT=now;t+=dt;
  if(phase==="enter"){if(G.enterStep?G.enterStep(K,t,dt):t>.8)ask()}
  else if(phase==="res"){(curOk?G.ok:G.ko)(K,t,dt);if(t>(G.dur||2.4))afterRes()}
  else if(phase==="over"){G.over&&G.over(K,t,dt)}
  else if(phase==="win"){G.win&&G.win(K,t,dt)}
  else G.idle&&G.idle(K,t,dt);
  K.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt});K.parts=K.parts.filter(p=>p.life>0);K.bub.forEach(b=>b.life-=dt);K.bub=K.bub.filter(b=>b.life>0);
  K.shake=Math.max(0,K.shake-dt*20);K.flash=Math.max(0,K.flash-dt*2.5);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.imageSmoothingEnabled=!G.pixel;
  if(K.shake)ctx.translate((Math.random()-.5)*K.shake,(Math.random()-.5)*K.shake);
  G.draw(K,now/1000);
  if(!G.pixel){const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.45)");ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
  K.parts.forEach(p=>{ctx.globalAlpha=Math.max(0,Math.min(1,p.life/p.max*1.5));ctx.fillStyle=p.c;if(G.pixel)ctx.fillRect(Math.round(p.x-p.r/2),Math.round(p.y-p.r/2),Math.ceil(p.r),Math.ceil(p.r));else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}});ctx.globalAlpha=1;
  K.bub.forEach(b=>{const[x,y]=b.at();bubble(b.txt,x,y,b.col)});
  if(K.flash){ctx.fillStyle=`rgba(255,255,255,${K.flash})`;ctx.fillRect(0,0,W,H)}

 S.coins.forEach(c=>{if(!c.got&&Math.abs(c.x-(S.hx+4))<8&&Math.abs((K.H-24+c.y)-(K.H-24+S.hy-8))<10){c.got=1;S.coinsN++;K.SFX.coin();S.fx.push({s:"+10",x:c.x,y:c.y-6,t:0})}});

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cache={};let manifest=null,filt="all",query="";
let EMB={};try{EMB=JSON.parse(document.getElementById("totest-data").textContent)}catch(e){}
if(EMB.manifest)manifest=EMB.manifest;if(EMB.tests)Object.assign(cache,EMB.tests);

function flag(spec){
 const W=300,H=200;let b="";
 if(spec==="ch")return `<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"><rect width="200" height="200" fill="#da291c"/><rect x="82" y="40" width="36" height="120" fill="#fff"/><rect x="40" y="82" width="120" height="36" fill="#fff"/></svg>`;
 const [t,rest]=spec.split(":"),p=rest.split(",");
 if(t==="h"||t==="v"){const parts=p.map(x=>{const[c,w]=x.split("*");return[c,+(w||1)]}),tot=parts.reduce((s,x)=>s+x[1],0);let o=0;
  for(const[c,w]of parts){const s=(t==="h"?H:W)*w/tot;b+=t==="h"?`<rect x="0" y="${o}" width="${W}" height="${s+.5}" fill="${c}"/>`:`<rect x="${o}" y="0" width="${s+.5}" height="${H}" fill="${c}"/>`;o+=s}}
 else if(t==="disc"){b=`<rect width="${W}" height="${H}" fill="${p[0]}"/><circle cx="${W*p[2]/100}" cy="${H/2}" r="${H*.3}" fill="${p[1]}"/>`}
 else if(t==="n"){b=`<rect width="${W}" height="${H}" fill="${p[0]}"/><rect x="84" y="0" width="${p[2]?44:32}" height="${H}" fill="${p[1]}"/><rect x="0" y="${p[2]?78:84}" width="${W}" height="${p[2]?44:32}" fill="${p[1]}"/>`+(p[2]?`<rect x="95" y="0" width="22" height="${H}" fill="${p[2]}"/><rect x="0" y="89" width="${W}" height="22" fill="${p[2]}"/>`:"")}
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${b}</svg>`;
}

function sheetSVG(){
 const rows=[1,3,0,2,1,3];let s="";
 rows.forEach((f,r)=>{s+=`<text x="4" y="${30+r*30}" font-family="Atkinson Hyperlegible,sans-serif" font-size="15" fill="#545b66">${r+1}</text>`;
  for(let c=0;c<4;c++){const x=46+c*52,y=25+r*30,on=c===f;s+=`<circle cx="${x}" cy="${y}" r="10" fill="${on?"#1f4fd1":"none"}" stroke="${on?"#1f4fd1":"#9aa1ab"}" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" font-family="sans-serif" fill="${on?"#fff":"#9aa1ab"}">${L[c]}</text>`}});
 return `<svg viewBox="0 0 270 200" role="img" aria-label="Hoja de respuestas con burbujas rellenadas"><text x="4" y="8" font-family="Archivo Black,sans-serif" font-size="12" fill="#16181c">HOJA DE RESPUESTAS</text>${s}<path d="M232 182 l26 -150" stroke="#e0a800" stroke-width="12" stroke-linecap="round"/><path d="M232 182 l4 -22" stroke="#16181c" stroke-width="5" stroke-linecap="round"/></svg>`;
}

/* ---------- Portada ---------- */
function hub(){
 document.title="ToTest · Tests para practicar";
 app.innerHTML=`<header class="top band"><div class="wrap"><div>
  <h1 class="brand">ToTest</h1><p class="tag">Tests para practicar de todo</p>
  <p>Bachillerato, programación, el teórico del carnet o «cuánto sabes de…». Elige un test, responde y se corrige solo, con la explicación de cada pregunta.</p>
  <div class="find"><input id="q" type="search" placeholder="Busca un tema: Python, banderas, DGT…" aria-label="Buscar test" value="${esc(query)}"></div>
  <div class="chips" style="margin:14px 0 0" role="group" aria-label="Categorías">
  ${[["all","Todos",""],...Object.entries(CATS).map(([k,v])=>[k,v[0],v[1]])].map(([k,n,c])=>`<button type="button" class="chip" data-c="${k}" aria-pressed="${filt===k}">${c?`<i style="background:${c}"></i>`:""}${n}</button>`).join("")}
 </div>
 </div><div class="sheet" aria-hidden="true">${sheetSVG()}</div></div></header>
 <section class="play band" id="play"><div class="wrap"><h2>Nuevo: aprende jugando</h2><p class="sub">Aquí tus respuestas no suman puntos: deciden lo que pasa en la partida.</p>
  <div class="pgrid" id="pgrid"></div><p class="empty" id="pempty" hidden style="color:#c9ced6">Ningún juego coincide con la búsqueda.</p>
 </div></section>
 <main class="band"><div class="wrap"><div class="grid" id="grid"></div></div></main>`;
 const g=document.getElementById("grid");
 const draw=()=>{const qq=query.trim().toLowerCase();
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");const nq=norm(qq);
  const games=GAMES.filter(gm=>(filt==="all"||gm.cat===filt)&&(!nq||norm(gm.title+" "+gm.level+" "+gm.desc+" juego jugar "+CATS[gm.cat][0]).includes(nq)));
  const pg=document.getElementById("pgrid");pg.innerHTML=games.map((gm,n)=>`<a class="pcard" href="#j-${gm.id}" style="--d:${n*60}ms"><div class="pimg">${POSTERS[gm.id]||""}<span class="shine"></span></div><div class="ptxt"><span class="lv">${esc(gm.level)}</span><p>${esc(gm.desc)}</p><span class="go">${esc(gm.cta)} →</span></div></a>`).join("");
  document.getElementById("play").hidden=!games.length&&(filt!=="all"||!!nq);document.getElementById("pempty").hidden=!!games.length;
  const list=manifest.filter(t=>(filt==="all"||t.cat===filt)&&(!nq||norm(t.title+" "+t.level+" "+t.desc+" "+CATS[t.cat][0]).includes(nq)));
  g.innerHTML=list.length?list.map(t=>{const best=store.get("best:"+t.id),c=CATS[t.cat][1];
   return `<a class="card" href="#t-${t.id}" style="--cc:${c}"><span class="lv">${esc(t.level)}</span><h2>${esc(t.title)}</h2><p>${esc(t.desc)}</p>
   <div class="meta"><span>${t.n} preguntas</span>${best?`<span class="best">Mejor: ${best.s}/${t.n}</span>`:`<span class="dots" aria-hidden="true"><b class="f"></b><b></b><b></b></span>`}</div></a>`}).join(""):`<p class="empty">${games.length?`No hay tests escritos sobre «${esc(query)}», pero sí ${games.length===1?"un juego":games.length+" juegos"} arriba.`:`No hay tests ni juegos sobre «${esc(query)}» todavía.`}</p>`};
 draw();
 document.getElementById("q").addEventListener("input",e=>{query=e.target.value;draw()});
 app.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{filt=b.dataset.c;app.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()}));
}

/* ---------- Test ---------- */
function runTest(T){
 const c=CATS[T.cat][1],N=T.q.length,dgt=T.rule==="dgt";
 let mode="inst",order,ans,graded;
 document.title=T.title+" · ToTest";
 app.style.setProperty("--cc",c);
 app.innerHTML=`<header class="thead band" style="--cc:${c}"><div class="wrap qs">
  <a href="#">← ToTest · Todos los tests</a><h1>${esc(T.title)}</h1><p>${esc(T.level)} · ${N} preguntas. ${esc(T.desc)}</p></div></header>
 <div class="bar" role="status" aria-live="polite"><span class="sc"><b id="s">0</b> aciertos · <span id="d">0</span>/${N}</span>
  <div class="meter" aria-hidden="true"><i id="m"></i></div>
  <div class="mode" role="group" aria-label="Modo de corrección"><button type="button" id="mi" aria-pressed="true">Corregir al momento</button><button type="button" id="me" aria-pressed="false">${dgt?"Simulacro de examen":"Corregir al final"}</button></div></div>
 <main class="band"><div class="qs"><p class="intro" id="intro"></p><div id="list"></div>
  <div class="actions"><button type="button" class="btn" id="grade" hidden>Corregir examen</button><button type="button" class="btn alt" id="reset">Empezar de nuevo</button></div>
  <section class="result" id="res" aria-live="polite"></section></div></main>`;
 const $=id=>document.getElementById(id);
 function build(){
  order=T.q.map(()=>shuffle([0,1,2,3]));ans=T.q.map(()=>null);graded=false;
  $("intro").textContent=mode==="inst"?"Cada respuesta se corrige en cuanto la eliges, con su explicación.":dgt?"Como en el examen de la DGT: responde todo y corrige al final. Apruebas con 3 fallos como máximo.":"Responde todo como en un examen. Puedes cambiar respuestas hasta pulsar «Corregir examen».";
  $("list").innerHTML=T.q.map((q,i)=>{const x=q[4],tag=typeof x==="string"?x:"",fl=x&&x.flag;
   return `<article class="q" id="q${i}"><header><strong>Pregunta ${i+1}</strong><span>${esc(tag)}</span></header>
   <h3>${rich(q[0])}</h3>${fl?`<div class="flag" ${fl==="ch"?`style="aspect-ratio:1;width:160px"`:""} role="img" aria-label="Bandera de la pregunta ${i+1}">${flag(fl)}</div>`:""}
   <div class="opts">${order[i].map((o,k)=>`<button type="button" class="opt" data-q="${i}" data-o="${o}"><span class="l">${L[k]}</span><span>${rich(q[1][o])}</span></button>`).join("")}</div>
   <button type="button" class="hint" data-h="${i}">Ver pista</button><p class="hinttxt" id="h${i}" hidden>${rich(q[2])}</p><div id="f${i}"></div></article>`}).join("");
  $("res").className="result";$("res").innerHTML="";update();
 }
 function reveal(i){
  const card=$("q"+i),right=ans[i]===0,q=T.q[i];
  card.querySelectorAll(".opt").forEach(b=>{const o=+b.dataset.o;b.disabled=true;b.classList.remove("sel");if(o===0)b.classList.add("ok");else if(o===ans[i])b.classList.add("ko")});
  card.querySelector(".hint").hidden=true;$("h"+i).hidden=true;
  $("f"+i).innerHTML=`<div class="fb ${right?"ok":"ko"}"><b>${ans[i]===null?"Sin responder. Era: "+rich(q[1][0]):right?"¡Correcto!":"Incorrecto. Era: "+rich(q[1][0])}</b>${rich(q[3])}</div>`;
  card.insertAdjacentHTML("beforeend",`<span class="stamp ${right?"ok":"ko"}">${right?"Bien":"Fallo"}</span>`);
 }
 function update(){
  const done=ans.filter(a=>a!==null).length,shown=mode==="inst"||graded,sc=ans.filter(a=>a===0).length;
  $("s").textContent=shown?sc:"–";$("d").textContent=done;$("m").style.width=(done/N*100)+"%";
  $("grade").hidden=mode!=="end"||graded;$("grade").disabled=done===0;
  if(shown&&done===N&&!$("res").classList.contains("show"))final();
 }
 function final(){
  const sc=ans.filter(a=>a===0).length,fails=N-sc;
  const prev=store.get("best:"+T.id);if(!prev||sc>prev.s)store.set("best:"+T.id,{s:sc});
  let big,msg;
  if(dgt){const ok=fails<=3;big=ok?"APTO":"NO APTO";msg=`${fails} fallo${fails===1?"":"s"} de ${N}. ${ok?"Con este resultado aprobarías el teórico.":"En el examen real solo se permiten 3 fallos. Repasa y vuelve a intentarlo."}`}
  else{const n=Math.round(sc/N*100)/10;big=String(n).replace(".",",")+" / 10";const r=sc/N;msg=`${sc} aciertos de ${N}. `+(r>=.9?"Impecable.":r>=.7?"Muy bien, ya casi lo tienes.":r>=.5?"Aprobado. Repasa los fallos para afianzarlo.":"Toca repasar. Lee las explicaciones y vuelve a intentarlo.")}
  const fl=T.q.map((q,i)=>ans[i]!==0?`<li><a href="#" data-go="${i}">Pregunta ${i+1}</a>: ${rich(q[1][0])}</li>`:"").join("");
  $("res").innerHTML=`<div class="big">${big}</div><p>${msg}</p>${fl?`<p>Para repasar:</p><ul>${fl}</ul>`:""}<div class="actions"><button type="button" class="btn" data-again>Repetir test</button><a class="btn alt" href="#">Elegir otro test</a></div>`;
  $("res").classList.add("show");
  $("res").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
 }
 $("list").addEventListener("click",e=>{
  const h=e.target.closest(".hint");if(h){const p=$("h"+h.dataset.h);p.hidden=!p.hidden;h.textContent=p.hidden?"Ver pista":"Ocultar pista";return}
  const b=e.target.closest(".opt");if(!b||b.disabled||graded)return;
  const i=+b.dataset.q;ans[i]=+b.dataset.o;
  if(mode==="inst")reveal(i);else b.parentNode.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));
  update();
 });
 $("res").addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();$("q"+g.dataset.go).scrollIntoView({block:"start"})}
  if(e.target.closest("[data-again]")){build();window.scrollTo({top:0})}});
 $("grade").addEventListener("click",()=>{graded=true;T.q.forEach((_,i)=>reveal(i));update();if(!$("res").classList.contains("show"))final()});
 $("reset").addEventListener("click",()=>{build();window.scrollTo({top:0})});
 const setMode=m=>{if(m===mode)return;mode=m;$("mi").setAttribute("aria-pressed",m==="inst");$("me").setAttribute("aria-pressed",m==="end");build()};
 $("mi").addEventListener("click",()=>setMode("inst"));$("me").addEventListener("click",()=>setMode("end"));
 build();window.scrollTo({top:0});
}

async function route(){
 const h=location.hash.slice(1);
 if(stopGame){try{stopGame()}catch(e){}stopGame=null}
 if(h.startsWith("j-")){const id=h.slice(2);if(GAMES.some(g=>g.id===id)){app.style.removeProperty("--cc");document.title=GAMES.find(g=>g.id===id).title+" · ToTest";
   try{if(!(window.ToTestGames&&window.ToTestGames[id]))await new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src="juegos/"+id+".js";sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)});
    if(location.hash.slice(1)!==h)return;stopGame=window.ToTestGames[id](app,{esc,store,rich,flag,tests:cache,poster:POSTERS[id]});window.scrollTo({top:0})}
   catch(e){app.innerHTML=`<p class="err">No se ha podido cargar el juego. Recarga la página.</p>`}return}}
 try{
  if(!manifest)manifest=await (await fetch("manifest.json")).json();
  if(h.startsWith("t-")){const id=h.slice(2);if(!manifest.some(t=>t.id===id))return hub();
   if(!cache[id])cache[id]=await (await fetch("tests/"+id+".json")).json();
   runTest(cache[id]);}
  else{app.style.removeProperty("--cc");hub()}
 }catch(e){app.innerHTML=`<p class="err">No se han podido cargar los tests. Recarga la página.</p>`}
}
addEventListener("hashchange",route);
route();
}
</script>
</body>
</html>
